<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Run: Digital Life</title>
<style>
:root{
  color-scheme:dark;
  --bg:#1E2240; --panel:#353853; --text:#FFFFFF; --muted:#C7C8CF; --ink:#1E2240;
  --ok:#0072B2; --no:#B34700; --cyan:#00AEC5; --pink:#D4547E; --orange:#F47B20; --green:#7DC242;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:12px;
  background:linear-gradient(90deg,var(--cyan) 0 25%,var(--pink) 25% 50%,var(--orange) 50% 75%,var(--green) 75% 100%)}
main{max-width:920px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#logo{height:56px;max-width:140px;object-fit:contain;display:none}
header h1{margin:0;font-size:1.6rem;line-height:1.1}
header p{margin:4px 0 0;color:var(--cyan);font-size:.9rem;font-weight:bold}
.stats{margin-left:auto;display:flex;gap:10px;font-weight:bold}
.chip{background:var(--panel);border-radius:999px;padding:6px 14px;white-space:nowrap}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;width:0;background:var(--cyan);transition:width .5s ease}
.card{border:2px solid var(--cyan);border-radius:16px;padding:20px;animation:pop .35s ease}
.card h2{margin:0 0 8px;color:var(--text)}
.hint{color:var(--cyan);margin:0 0 14px;font-weight:bold}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
button{font:inherit;cursor:pointer}
.tile{--c:var(--cyan);background:#fff;color:var(--ink);border:3px solid transparent;border-top:8px solid var(--c);border-radius:10px;
  padding:12px;text-align:left;min-height:56px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--c)}
.tile.sel{background:#FFF1B8;outline:4px dotted var(--ink)}
.tile.done,.tile.right{background:#D3E8F8;outline:4px solid var(--ok);--c:var(--ok)}
.tile.done{cursor:default;animation:glow .6s ease}
.tile.wrong,.tile.miss{background:#FBE0CC;outline:4px dashed var(--no);--c:var(--no)}
.tile.sel::after,.tile.done::after,.tile.right::after,.tile.wrong::after,.tile.miss::after{display:block;margin-top:6px;font-size:.85rem;font-weight:bold}
.tile.sel::after{content:"● Selected"}
.tile.done::after{content:"✔ Matched"}
.tile.right::after{content:"✔ Correct answer"}
.tile.miss::after{content:"✘ Your answer"}
.tile.wrong::after{content:"✘ Not a match"}
.tile.wrong{animation:shake .4s}
.opts{display:grid;gap:10px;margin-top:14px}
.q{font-size:1.25rem;font-weight:bold}
.fb{margin-top:14px;padding:12px;border-radius:10px;background:var(--panel);min-height:48px}
.go{margin-top:16px;background:var(--cyan);color:var(--ink);border:0;border-radius:999px;padding:12px 28px;font-weight:bold;font-size:1.05rem}
.go:hover{filter:brightness(1.1)}
.big{font-size:3rem;margin:0}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.shot{margin-top:12px;color:var(--orange);font-weight:bold}
.sub{color:var(--muted);font-size:.9rem;margin-top:10px}
.conf{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--ok)}to{box-shadow:0 0 0 18px transparent}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:620px){.cols{grid-template-columns:1fr}.stats{display:none}#logo{margin-left:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.stage{position:relative;max-width:780px;margin:0 auto;--u:1px}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:2px solid var(--cyan);background:#070B24;touch-action:pan-y}
.hud{position:absolute;left:2px;right:2px;top:2px;padding:calc(var(--u)*8) calc(var(--u)*10) calc(var(--u)*10);background:linear-gradient(rgba(7,11,36,.95),rgba(7,11,36,.84));border-radius:10px 10px 0 0;pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:calc(var(--u)*6)}
.hrow .chip{font-size:max(12px,calc(var(--u)*18));padding:calc(var(--u)*3) calc(var(--u)*14);font-weight:bold}
.hlvl{font-size:max(10px,calc(var(--u)*14));color:var(--cyan);font-weight:bold;text-align:center}
.qtext{font-size:max(12px,calc(var(--u)*22));font-weight:bold;line-height:1.2;margin-bottom:calc(var(--u)*8)}
.achips{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*8)}
.ach{--c:var(--cyan);pointer-events:auto;position:relative;display:flex;gap:calc(var(--u)*6);align-items:flex-start;text-align:left;background:#fff;color:var(--ink);border:0;border-top:calc(var(--u)*6) solid var(--c);border-radius:calc(var(--u)*8);padding:calc(var(--u)*6);font:inherit;font-size:max(10px,calc(var(--u)*14));line-height:1.15;min-height:calc(var(--u)*54);cursor:pointer}
.ach i{flex:none;font-style:normal;font-weight:bold;width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%;background:var(--c);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:max(11px,calc(var(--u)*15))}
.ach.here{outline:3px dotted #fff;outline-offset:1px}
.ach.right{background:#D3E8F8;outline:4px solid var(--ok)}
.ach.miss{background:#FBE0CC;outline:4px dashed var(--no)}
.ach.right::after,.ach.miss::after{position:absolute;top:calc(var(--u)*2);right:calc(var(--u)*5);font-weight:bold;font-size:max(12px,calc(var(--u)*16))}
.ach.right::after{content:"✔"}
.ach.miss::after{content:"✘"}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(7,11,36,.82);border-radius:12px;z-index:3}
.ovc{background:var(--bg);border:2px solid var(--cyan);border-radius:14px;padding:16px;max-width:520px;text-align:left}
.ovc h2{margin:0 0 6px}
.toast{position:absolute;top:calc(var(--u)*196);left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:10px;font-weight:bold;display:none;max-width:92%;text-align:center;font-size:max(12px,calc(var(--u)*18));z-index:2}
.toast.ok{background:#D3E8F8;color:var(--ink);border:3px solid var(--ok)}
.toast.no{background:#FBE0CC;color:var(--ink);border:3px dashed var(--no)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.ctl .go{margin-top:0;padding:10px 22px;font-size:1rem}
.go.on{outline:4px solid #FFE600;outline-offset:2px}
.bigscore{font-size:2.8rem;font-weight:bold;margin:6px 0;color:var(--cyan)}
.ul2{text-align:left;padding-left:20px;line-height:1.5}
@media (max-width:560px){.achips{grid-template-columns:1fr 1fr}}
</style>
</head>

</main>

    ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.lineWidth = 3;
    for (let k = 0; k < 18; k++) { const x = 60 + (k * 97) % (W - 120), y = calm ? HZ + (k * 53) % (H - HZ) : HZ + (tm * 1400 + k * 71) % (H - HZ); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40); ctx.stroke(); }
    ctx.fillStyle = "#FFE600"; ctx.font = "bold 26px Trebuchet MS,Segoe UI,sans-serif"; ctx.textAlign = "center"; ctx.fillText("⚡ BOOST!", CX, HZ + 40);
  }
  drawPlayer();
  rings.forEach(r => { ctx.globalAlpha = Math.max(0, r.life); ctx.lineWidth = 6; ctx.strokeStyle = r.good ? "#7DFFB0" : "#FF7A8A"; ctx.setLineDash(r.good ? [] : [12, 9]); ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); });
  ctx.setLineDash([]);
  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.font = "bold " + p.sz + "px Consolas,monospace"; ctx.textAlign = "center"; ctx.fillText(p.ch, p.x, p.y); });
  ctx.globalAlpha = 1; ctx.restore();
}

// A ring and a burst of symbols around the runner: smooth rings, sparkles and ✔ for right, dashed rings and ✕ for wrong.
function fx(good) {
  const x = CX + (px - 1.5) * LW, y = PY - 70;
  rings.push({ x, y, r: 26, life: 1, good }, { x, y, r: 8, life: 1.4, good });
  if (calm) return;
  const chars = good ? ["✦", "0", "1", "✔"] : ["✕", "!", "✕", "0"], cols = good ? ["#7DFFB0", "#00E5FF", "#FFE600"] : ["#FF7A8A", "#F47B20", "#FFB3BC"];
  for (let k = 0; k < 44; k++) { const a = k / 44 * Math.PI * 2 + Math.random() * .3, sp = 110 + Math.random() * 200; parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: good ? -70 : 280, life: 1, ch: chars[k % chars.length], col: cols[k % cols.length], sz: 16 + Math.random() * 14 }); }
}

function update(dt) {
  if (zt < 1) zt = Math.min(1, zt + dt / 2.5);
  tm += dt; if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0 && toast) toast.style.display = "none"; }
  if (!calm) rain.forEach(r => { r.y += r.s * dt; if (r.y > HZ) { r.y = 0; r.x = Math.random() * W; r.c = rch(); } });
  px += (lane - px) * Math.min(1, dt * 12);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g === undefined ? 600 : p.g) * dt; p.vx *= .985; p.life -= dt * 1.1; }); parts = parts.filter(p => p.life > 0);
  rings.forEach(r => { r.life -= dt * 1.4; if (!calm) r.r += 380 * dt; }); rings = rings.filter(r => r.life > 0);
  const base = q ? (ZSTART - ZEND) / q.seconds : 3, spd = base * (boosted ? GAME.boostFactor : 1);
  let target = 0;
  if (phase === "run" || phase === "pass" || phase === "crash") {
    timeLeft -= dt; setClock();
    const c = Math.ceil(timeLeft); if (timeLeft > 0 && timeLeft <= 10 && c !== lastTick) { lastTick = c; sfx.tick(); }
  }
  if (phase === "run") { gate.z -= spd * dt; target = Math.min(spd, base * 3); if (timeLeft <= 0) return end(); if (gate.z <= ZEND) resolve(); }
  else if (phase === "pass") { target = base; gate.z -= base * dt * 1.4; gate.lift = Math.min(1, gate.lift + dt * 2.2); timer -= dt; if (timer <= 0) after(); }
  else if (phase === "crash") { timer -= dt; if (timer <= 0) after(); }
  vel += (target - vel) * Math.min(1, dt * 6); off += vel * dt;
}

function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (!paused && phase !== "end") update(dt);
  draw(); raf = requestAnimationFrame(loop);
}

/* ---------------- Game flow ---------------- */
const fmt = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const words = t => { const m = Math.floor(t / 60), s = t % 60; return (m ? m + " minute" + (m > 1 ? "s" : "") : "") + (m && s ? " " : "") + (s ? s + " seconds" : "") + " (" + t + " seconds)"; };
function setClock() {
  const c = $("clock"); if (c) c.textContent = "⏱ " + fmt(timeLeft);
  $("prog").style.width = (Math.max(0, timeLeft) / GAME.timeLimit * 100) + "%";
}
function setScore() { const c = $("scoreChip"); if (c) c.textContent = "Score: " + score; }
function setLane(k) { if (k === lane || k < 0 || k > 3) return; lane = k; sfx.step(); markHere(); }
function markHere() { opts.forEach((b, k) => b.classList.toggle("here", k === lane && phase === "run")); }
function showToast(txt, ok) { toast.textContent = txt; toast.className = "toast " + (ok ? "ok" : "no"); toast.style.display = "block"; toastT = 1.8; }

function buildQ(x, ti) {
  const o = shuffle(x.o.map((txt, k) => ({ txt, ok: k === x.a }))), t = GAME.tiers[ti];
  return { q: x.q, opts: o.map(a => a.txt), a: o.findIndex(a => a.ok), level: ti + 1, tierName: t.name, seconds: t.seconds, points: t.points, src: x };
}
function extend() {
  const T = GAME.tiers.length, used = new Set(Q.map(z => z.src)); let pool = [];
  const gather = () => { for (let ti = Math.max(0, T - 2); ti < T; ti++) GAME.tiers[ti].questions.forEach(x => { if (!used.has(x)) pool.push([x, ti]); }); };
  gather(); if (!pool.length) { used.clear(); gather(); }
  shuffle(pool).slice(0, 5).forEach(([x, ti]) => Q.push(buildQ(x, ti)));
}

function start() {
  const h = /^#([0-9]{1,9})$/.exec(location.hash);
  seed = firstLaunch && h ? +h[1] : newSeed(); firstLaunch = false; rnd = mulberry32(seed);
  Q = []; GAME.tiers.forEach((t, ti) => shuffle(t.questions).slice(0, t.pick).forEach(x => Q.push(buildQ(x, ti))));
  cancelAnimationFrame(raf); stopMusic(); phase = "idle"; cv = null; qi = 0; results = []; score = 0; timeLeft = GAME.timeLimit; $("prog").style.width = "100%";
  const c = el("div", "card");
  c.append(el("p", "big", "🏃"), el("h2", "", "Race to the CPU!"),
    el("p", "hint", "You are a data packet racing through the computer. You have " + words(GAME.timeLimit) + " to answer as many questions as you can."));
  const ul = el("ul", "ul2");
  ["The timer is shown at the top of the game window and counts down from " + fmt(GAME.timeLimit) + ".",
   "Firewalls A, B, C and D block the road. Steer into the lane with the right answer to open the firewall.",
   "Move with the ← → arrow keys (or A and D), press 1 to 4, swipe, or tap an answer at the top.",
   "Every right answer scores points, and harder questions score more.",
   "Feeling sure? Press Space, ↑ or the ⚡ Boost button to speed up fast and earn bonus points.",
   "A wrong lane scores nothing, but there is no penalty. Press P to pause."].forEach(t => ul.append(el("li", "", t)));
  const ctl = el("div", "ctl"), snd = el("button", "go alt sndbtn", ""), rel = el("button", "go alt", "Relaxed pace: off");
  snd.onclick = () => { audioInit(); setMuted(!muted); sfx.step(); };
  rel.onclick = () => { relaxed = !relaxed; rel.textContent = "Relaxed pace: " + (relaxed ? "on (more time per question)" : "off"); };
  const go = el("button", "go", "Start the run"); go.onclick = begin; ctl.append(snd, rel, go);
  c.append(ul); if (GAME.help) c.append(el("p", "hint", GAME.help)); c.append(ctl); app.replaceChildren(c); setMuted(muted);
}

function begin() {
  audioInit(); startMusic();
  const card = el("div", "card"), stage = el("div", "stage");
  cv = document.createElement("canvas"); dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cv.setAttribute("role", "img"); cv.setAttribute("aria-label", "A runner racing along a circuit board towards four firewall gates labelled A, B, C and D. Use the answer buttons at the top of the game window to choose.");
  ctx = cv.getContext("2d"); ov = el("div", "ov"); toast = el("div", "toast");
  const hud = el("div", "hud"), row = el("div", "hrow"), sc = el("span", "chip", ""), ck = el("span", "chip", ""); sc.id = "scoreChip"; ck.id = "clock";
  lvlEl = el("div", "hlvl", ""); row.append(sc, lvlEl, ck); qText = el("div", "qtext", "");
  const chips = el("div", "achips"); opts = [0, 1, 2, 3].map(k => { const b = el("button", "ach"); b.style.setProperty("--c", LANE_COL[k]); b.onclick = () => { if (phase === "run" || phase === "pass") setLane(k); }; chips.append(b); return b; });
  hud.append(row, qText, chips); stage.append(cv, hud, ov, toast);
  const ctl = el("div", "ctl"); boostBtn = el("button", "go", "⚡ Boost"); boostBtn.onclick = doBoost;
  pauseBtn = el("button", "go alt", "⏸ Pause"); pauseBtn.onclick = () => togglePause();
  const snd = el("button", "go alt sndbtn", ""); snd.onclick = () => { setMuted(!muted); sfx.step(); };
  ctl.append(boostBtn, pauseBtn, snd);
  card.append(stage, ctl); app.replaceChildren(card); setMuted(muted);
  card.addEventListener("click", e => { const b = e.target.closest("button"); if (b) b.blur(); });
  const fit = () => stage.style.setProperty("--u", (stage.clientWidth / W) + "px"); fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else addEventListener("resize", fit);
  let sx = null;
  cv.onpointerdown = e => { sx = e.clientX; }; cv.onpointerup = e => { if (sx !== null && (phase === "run" || phase === "pass")) { const d = e.clientX - sx; if (Math.abs(d) > 30) setLane(Math.max(0, Math.min(3, lane + (d > 0 ? 1 : -1)))); } sx = null; };
  zA = zB = ZONES[0]; zt = 1; lane = 1; px = 1; off = 0; vel = 0; parts = []; rings = []; paused = false; qi = 0; results = []; score = 0; timeLeft = GAME.timeLimit; lastTick = 0; toastT = 0; boosted = false;
  setClock(); setScore(); cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
  nextQ();
}

function nextQ() {
  if (qi >= Q.length) extend();
  q = Q[qi]; if (relaxed) q = { ...q, seconds: q.seconds * 1.6 };
  const nz = ZONES[Math.min(q.level - 1, ZONES.length - 1)]; if (nz !== zB) { zA = zB; zB = nz; zt = 0; }
  boosted = false; boostBtn.textContent = "⚡ Boost"; boostBtn.classList.remove("on");
  lvlEl.textContent = "Level " + q.level + " · " + q.tierName + " · " + q.points + " points"; qText.textContent = q.q;
  opts.forEach((b, k) => { b.className = "ach"; b.replaceChildren(el("i", "", "ABCD"[k]), el("span", "", q.opts[k])); b.setAttribute("aria-label", "Lane " + "ABCD"[k] + ": " + q.opts[k]); });
  gate = { z: ZSTART, open: null, lift: 0 }; phase = "run"; ov.style.display = "none"; markHere();
}

function doBoost() {
  if (phase !== "run" || boosted || paused) return;
  boosted = true; boostBtn.textContent = "⚡ Boosting!"; boostBtn.classList.add("on"); sfx.boost();
}

function resolve() {
  const ok = lane === q.a; gate.z = ZEND; markHere();
  const bonus = ok && boosted ? Math.round(q.points * GAME.boostBonus) : 0, pts = ok ? q.points + bonus : 0;
  score += pts; results.push({ ok, boosted, pts }); setScore();
  opts[q.a].classList.add("right"); if (!ok) opts[lane].classList.add("miss");
  showToast(ok ? "✔ +" + pts + (bonus ? " (boost bonus +" + bonus + ")" : "") : "✘ The answer was " + "ABCD"[q.a] + ": " + q.opts[q.a], ok);
  fx(ok);
  if (ok) { gate.open = lane; phase = "pass"; timer = 1; sfx.good(); } else { phase = "crash"; timer = 1.3; shake = 16; sfx.bad(); }
}

function after() { qi++; if (timeLeft <= 0) return end(); nextQ(); }

function togglePause(force) {
  if (phase === "idle" || phase === "end") return;
  paused = force !== undefined ? force : !paused; pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
  if (paused) { const c = el("div", "ovc"); c.append(el("h2", "", "Paused"), el("p", "", "The timer is stopped. The run carries on when you press Resume.")); const b = el("button", "go", "Resume"); b.onclick = () => togglePause(false); c.append(b); ov.replaceChildren(c); ov.style.display = "flex"; }
  else ov.style.display = "none";
}

function end() {
  phase = "end"; cancelAnimationFrame(raf); stopMusic(); sfx.done(); timeLeft = Math.max(0, timeLeft);
  const got = results.filter(r => r.ok).length, c = el("div", "card");
  c.append(el("p", "big", "🏁"), el("h2", "", "Time’s up!"), el("div", "bigscore", "Score: " + score),
    el("p", "hint", "You got " + got + " out of " + results.length + " right."),
    el("p", "shot", "📸 Take a screenshot and add it to your OneNote."), el("p", "sub", GAME.helpEnd || GAME.help || ""),
    el("p", "sub", [GAME.module, GAME.lesson, GAME.title, "Set " + seed].filter(Boolean).join(" · ")));
  const b = el("button", "go", "Play again"); b.onclick = start; c.append(b);
  app.replaceChildren(c); $("prog").style.width = "0%";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); return; }
  if (!cv || phase === "idle" || phase === "end") return;
  const k = e.key.toLowerCase();
  if (k === "p" || k === "escape") { e.preventDefault(); togglePause(); }
  else if (!paused && (phase === "run" || phase === "pass")) {
    if (k === "arrowleft" || k === "a") { e.preventDefault(); setLane(lane - 1); }
    else if (k === "arrowright" || k === "d") { e.preventDefault(); setLane(lane + 1); }
    else if (k >= "1" && k <= "4") setLane(+k - 1);
    else if (k === " " || k === "arrowup" || k === "w") { e.preventDefault(); doBoost(); }
  }
}, true);
document.addEventListener("visibilitychange", () => { if (document.hidden && (phase === "run" || phase === "pass")) togglePause(true); });

document.querySelector(".stats").style.display = "none";
$("gTitle").textContent = GAME.title;
$("gSub").textContent = [GAME.module, GAME.lesson, GAME.subtitle].filter(Boolean).join(" · ");
if (GAME.logo) { $("logo").src = GAME.logo; $("logo").style.display = "block"; }
document.title = GAME.title;
start();
</script>
</body>
</html>
