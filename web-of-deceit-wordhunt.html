<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web of Deceit: Word Hunt</title>
<style>
:root{
  color-scheme:dark;
  --bg:#1E2240; --panel:#353853; --text:#FFFFFF; --muted:#C7C8CF; --ink:#1E2240;
  --ok:#0072B2; --no:#B34700; --cyan:#00AEC5; --pink:#D4547E; --orange:#F47B20; --green:#7DC242;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:12px;
  background:linear-gradient(90deg,var(--cyan) 0 25%,var(--pink) 25% 50%,var(--orange) 50% 75%,var(--green) 75% 100%)}
main{max-width:920px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#logo{height:56px;max-width:140px;object-fit:contain;display:none}
header h1{margin:0;font-size:1.6rem;line-height:1.1}
header p{margin:4px 0 0;color:var(--cyan);font-size:.9rem;font-weight:bold}
.stats{margin-left:auto;display:flex;gap:10px;font-weight:bold}
.chip{background:var(--panel);border-radius:999px;padding:6px 14px;white-space:nowrap}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;width:0;background:var(--cyan);transition:width .5s ease}
.card{border:2px solid var(--cyan);border-radius:16px;padding:20px;animation:pop .35s ease}
.card h2{margin:0 0 8px;color:var(--text)}
.hint{color:var(--cyan);margin:0 0 14px;font-weight:bold}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
button{font:inherit;cursor:pointer}
.tile{--c:var(--cyan);background:#fff;color:var(--ink);border:3px solid transparent;border-top:8px solid var(--c);border-radius:10px;
  padding:12px;text-align:left;min-height:56px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--c)}
.tile.sel{background:#FFF1B8;outline:4px dotted var(--ink)}
.tile.done,.tile.right{background:#D3E8F8;outline:4px solid var(--ok);--c:var(--ok)}
.tile.done{cursor:default;animation:glow .6s ease}
.tile.wrong,.tile.miss{background:#FBE0CC;outline:4px dashed var(--no);--c:var(--no)}
.tile.sel::after,.tile.done::after,.tile.right::after,.tile.wrong::after,.tile.miss::after{display:block;margin-top:6px;font-size:.85rem;font-weight:bold}
.tile.sel::after{content:"● Selected"}
.tile.done::after{content:"✔ Matched"}
.tile.right::after{content:"✔ Correct answer"}
.tile.miss::after{content:"✘ Your answer"}
.tile.wrong::after{content:"✘ Not a match"}
.tile.wrong{animation:shake .4s}
.opts{display:grid;gap:10px;margin-top:14px}
.q{font-size:1.25rem;font-weight:bold}
.fb{margin-top:14px;padding:12px;border-radius:10px;background:var(--panel);min-height:48px}
.go{margin-top:16px;background:var(--cyan);color:var(--ink);border:0;border-radius:999px;padding:12px 28px;font-weight:bold;font-size:1.05rem}
.go:hover{filter:brightness(1.1)}
.big{font-size:3rem;margin:0}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.shot{margin-top:12px;color:var(--orange);font-weight:bold}
.sub{color:var(--muted);font-size:.9rem;margin-top:10px}
.conf{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--ok)}to{box-shadow:0 0 0 18px transparent}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:620px){.cols{grid-template-columns:1fr}.stats{display:none}#logo{margin-left:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lay{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:20px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lt{--c:var(--cyan);position:relative;aspect-ratio:1;background:#fff;color:var(--ink);border:3px solid transparent;border-top:8px solid var(--c);
  border-radius:10px;font-size:1.7rem;font-weight:bold;text-transform:uppercase;padding:0}
.lt:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--c)}
.lt.sel{background:#FFF1B8;outline:4px dotted var(--ink)}
.lt.sel::after{content:attr(data-n);position:absolute;top:2px;right:6px;font-size:.8rem}
.cur{margin:14px 0 8px;min-height:56px;background:var(--panel);border-radius:10px;padding:10px 14px;font-size:1.6rem;font-weight:bold;letter-spacing:4px;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap}
.go.alt{background:transparent;color:var(--text);border:2px solid var(--cyan)}
.msg{margin-top:12px;min-height:26px;font-weight:bold}
.clues{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.clue{background:#fff;color:var(--ink);border-top:8px solid var(--cyan);border-radius:10px;padding:10px 12px}
.clue b{display:block;letter-spacing:3px;font-size:1.1rem}
.clue span{font-size:.95rem}
.clue.done{background:#D3E8F8;outline:4px solid var(--ok)}
.clue.done::after{content:"✔ Found";display:block;margin-top:4px;font-size:.85rem;font-weight:bold}
.warn{background:#FBE0CC;color:var(--ink);border:3px dashed var(--no);border-radius:10px;padding:10px;margin-bottom:12px;font-weight:bold}
ul.fin{text-align:left;padding-left:20px}
@media (max-width:760px){.lay{grid-template-columns:1fr}}
.lt.rv{background:#D3E8F8;outline:4px solid var(--ok)}
.lt.rv::after{content:attr(data-n);position:absolute;top:2px;right:6px;font-size:.8rem}
.clue small{display:block;color:#555;font-weight:bold;font-size:.8rem;margin-bottom:2px}
.clue.rvd::after{content:"Revealed";display:block;margin-top:4px;font-size:.85rem;font-weight:bold}
.hback{position:fixed;inset:0;z-index:50;background:rgba(10,14,40,.85);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.hp{background:var(--bg);border:2px solid var(--cyan);border-radius:16px;max-width:680px;width:100%;padding:18px;margin:auto}
.hp h2{margin:0 0 10px}
.hbody{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.hdemo{flex:0 1 250px;margin:0 auto;text-align:center}
.hdemo svg{width:100%;max-width:250px;height:auto;display:block;margin:0 auto}
.hcap{min-height:3.2em;margin:8px 0;font-weight:bold;color:var(--cyan)}
.htxt{flex:1 1 240px;margin:0;padding-left:20px;line-height:1.5;font-size:.95rem}
.htxt li{margin-bottom:6px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hbtns .go{margin-top:6px;padding:8px 18px;font-size:.95rem}
</style>
</head>

<main>
  <header>
    <div><h1 id="gTitle"></h1><p id="gSub"></p></div>
    <button class="go alt" id="helpBtn" style="margin:0;padding:6px 14px;font-size:.9rem" aria-haspopup="dialog">❓ How to play</button>
    <div class="stats"><span class="chip" id="count"></span></div>
    <img id="logo" alt="School logo">
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div id="app"></div>
</main>

  const wrap = el("div");
  if (warn) wrap.append(el("div", "warn", "⚠ Teacher note:" + warn));
  const lay = el("div", "lay"), left = el("div"), grid = el("div", "grid");
  grid.style.gridTemplateColumns = "repeat(" + N + ",1fr)";
  tiles = [];
  G.forEach((row, r) => row.forEach((ch, c) => {
    const t = el("button", "lt", ch); t.dataset.k = r * N + c; t.setAttribute("aria-label", "Letter " + ch);
    t.style.fontSize = N > 6 ? "1.35rem" : "1.7rem";
    t.onclick = () => pick(r * N + c); tiles.push(t); grid.append(t);
  }));
  left.append(grid, el("div", "cur", ""));
  const row = el("div", "row"), chk = el("button", "go", "Check word"), clr = el("button", "go alt", "Clear"), rvb = el("button", "go alt", "Reveal a word");
  chk.onclick = check; clr.onclick = () => { path = []; rv = []; say(""); draw(); };
  rvb.onclick = reveal;
  row.append(chk, clr, rvb); left.append(row, el("div", "msg", "Click letters that touch to build a word. New to this? Press “❓ How to play” at the top."));
  const right = el("div");
  right.append(el("h2", "", "Find these keywords"), el("p", "hint", "Read each clue, then find the word on the grid. Stuck? “Reveal a word” shows you one, but it will not count as found by you."));
  const ul = el("ul", "clues");
  WORDS.forEach(x => { const li = el("li", "clue"); li.dataset.w = x.w; li.append(el("small", "", "Level " + x.level + " · " + x.tier), el("b", ""), el("span", "", x.c)); ul.append(li); });
  right.append(ul); lay.append(left, right); wrap.append(lay); app.replaceChildren(wrap); draw();
}

function say(t) { const m = document.querySelector(".msg"); if (m) m.textContent = t; }
function draw() {
  tiles.forEach(t => {
    const k = +t.dataset.k, i = path.indexOf(k), j = rv.indexOf(k);
    t.classList.toggle("sel", i >= 0); t.classList.toggle("rv", j >= 0 && i < 0);
    if (i >= 0) t.dataset.n = i + 1; else if (j >= 0) t.dataset.n = j + 1; else delete t.dataset.n;
  });
  document.querySelector(".cur").textContent = cur();
  document.querySelectorAll(".clue").forEach(li => {
    const w = li.dataset.w, f = found.has(w);
    li.classList.toggle("done", f && !revealed.has(w)); li.classList.toggle("rvd", revealed.has(w));
    li.querySelector("b").textContent = f ? w : (GAME.showFirstLetter ? w[0] + " " : "_ ") + "_ ".repeat(w.length - 1).trim() + "  (" + w.length + " letters)";
  });
}

function pick(k) {
  rv = [];
  const last = path[path.length - 1];
  if (path.length && k === last) path.pop();
  else if (path.includes(k)) return say("You have already used that square in this word.");
  else if (path.length && !touch(last, k)) return say("Pick a letter that touches the last one you chose.");
  else path.push(k);
  say(""); draw();
}

function done(late) { if (found.size === WORDS.length) setTimeout(finish, late ? 3000 : 1000); }

function check() {
  const w = cur();
  if (!w) return say("Choose some letters first.");
  if (found.has(w)) { path = []; draw(); return say("You have already found " + w + ". Look for another keyword."); }
  if (WORDS.some(x => x.w === w)) {
    found.add(w); path = []; rv = []; hud(); draw(); say("✔ Found it: " + w + "!"); done(false);
  } else { path = []; draw(); say("Not one of the keywords this time. Try another path or read the clues again."); }
}

function reveal() {
  const x = WORDS.find(y => !found.has(y.w));
  if (!x) return;
  found.add(x.w); revealed.add(x.w); path = [];
  rv = (PATHS[x.w] || []).map(([r, c]) => r * N + c); hud(); draw();
  say("Revealed: " + x.w + ". Follow the numbers on the grid to see how it is spelled.");
  done(true);
}

function finish() {
  const got = found.size - revealed.size, all = revealed.size === 0, c = el("div", "card");
  c.append(el("p", "big", all ? "🏆" : "👍"), el("h2", "", all ? "Mission complete!" : "Round finished!"),
    el("p", "hint", "You found " + got + " out of " + WORDS.length + " keywords yourself." + (all ? "" : " For the others you used a reveal, so have another go to see if you can find them on your own.")));
  const ul = el("ul", "fin");
  WORDS.forEach(x => { const li = el("li"); li.append(el("b", "", (revealed.has(x.w) ? "Revealed: " : "✔ ") + x.w), document.createTextNode(": " + x.c)); ul.append(li); });
  c.append(ul, el("p", "shot", "📸 Take a screenshot of this screen and add it to your OneNote."),
    el("p", "sub", [GAME.module, GAME.lesson, GAME.title, "Set " + seed].filter(Boolean).join(" · ")));
  const b = el("button", "go", "Play again"); b.onclick = start; c.append(b);
  app.replaceChildren(c); confetti();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bits = ["🔍", "🌐", "💻", "✔", "🕵️"];
  for (let i = 0; i < 24; i++) {
    const e = el("span", "conf", bits[i % bits.length]);
    e.style.left = Math.random() * 100 + "vw"; e.style.animationDuration = 2 + Math.random() * 2 + "s"; e.style.animationDelay = Math.random() + "s";
    document.body.append(e); setTimeout(() => e.remove(), 5500);
  }
}

document.addEventListener("keydown", e => {
  if (!document.querySelector(".cur") || $("helpBack")) return;
  if (e.key === "Enter") { e.preventDefault(); check(); }
  else if (e.key === "Escape") { path = []; rv = []; say(""); draw(); }
});


/* ---------- "How to play" help with a small animated example ---------- */
function openHelp() {
  if ($("helpBack")) return;
  const DEM = ["STRL", "PCXO", "QAKE", "MBDF"], PATH = [[0, 0], [1, 1], [2, 1], [3, 0]];
  const CAP = ["Here is a mini grid. Let’s spell the word SCAM.", "Start on S.", "C touches S. It is diagonal, and that is allowed!", "A is directly below C, so it touches C.", "M touches A (diagonal again). Now the letters spell SCAM.", "✔ Press “Check word”. SCAM is found!"];
  const back = el("div"); back.id = "helpBack"; back.className = "hback";
  back.setAttribute("role", "dialog"); back.setAttribute("aria-modal", "true"); back.setAttribute("aria-label", "How to play");
  const panel = el("div", "hp"), body = el("div", "hbody"), demo = el("div", "hdemo"), cap = el("div", "hcap", ""), box = el("div");
  let step = 0, timer = null;
  const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const paint = () => {
    let svg = '<svg viewBox="0 0 240 240" role="img" aria-label="Animated example of picking touching letters">';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const k = PATH.findIndex(p => p[0] === r && p[1] === c), on = k >= 0 && k < Math.min(step, 4), done = step === 5 && k >= 0;
      const x = c * 60, y = r * 60;
      svg += `<rect x="${x + 2}" y="${y + 2}" width="56" height="56" rx="8" fill="${done ? "#D3E8F8" : on ? "#FFF1B8" : "#fff"}"${done ? ' stroke="#0072B2" stroke-width="4"' : on ? ' stroke="#1E2240" stroke-width="4" stroke-dasharray="1 5" stroke-linecap="round"' : ' stroke="#00AEC5" stroke-width="2"'}/>`;
      svg += `<text x="${x + 30}" y="${y + 41}" text-anchor="middle" font-size="28" font-weight="bold" fill="#1E2240" font-family="Trebuchet MS,Segoe UI,sans-serif">${DEM[r][c]}</text>`;
      if (on || done) svg += `<text x="${x + 50}" y="${y + 16}" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E2240" font-family="Trebuchet MS,Segoe UI,sans-serif">${k + 1}</text>`;
    }
    const n = Math.min(step, 4);
    if (n > 1) svg += `<polyline points="${PATH.slice(0, n).map(p => (p[1] * 60 + 30) + "," + (p[0] * 60 + 30)).join(" ")}" fill="none" stroke="#F47B20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
    box.innerHTML = svg + "</svg>"; cap.textContent = CAP[step];
  };
  const stop = () => { clearTimeout(timer); timer = null; };
  const tick = () => { step = (step + 1) % 6; paint(); timer = setTimeout(tick, step === 5 ? 2800 : 1300); };
  const play = () => { stop(); step = 0; paint(); if (!quiet) timer = setTimeout(tick, 1300); };
  const close = () => { stop(); back.remove(); document.removeEventListener("keydown", esc, true); $("helpBtn").focus(); };
  const esc = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener("keydown", esc, true);
  const btns = el("div", "hbtns"), nx = el("button", "go alt", "Next step"), rp = el("button", "go alt", "Replay"), ok = el("button", "go", "Got it");
  nx.onclick = () => { stop(); step = (step + 1) % 6; paint(); }; rp.onclick = play; ok.onclick = close;
  back.onclick = e => { if (e.target === back) close(); };
  btns.append(nx, rp); demo.append(box, cap, btns);
  const tx = el("ul", "htxt");
  [["This is not a word search.", " The letters do not have to be in a straight line."],
   ["Letters only need to touch.", " Each new letter must be next to the last one: up, down, sideways or diagonal."],
   ["The path can bend and turn", " as much as you like."],
   ["Use each square once", " in a word. Click the last letter again to undo it."],
   ["Spelled a keyword?", " Press “Check word”. Use the clues to guess what to look for."]]
    .forEach(([b, t]) => { const li = el("li"); li.append(el("b", "", b), document.createTextNode(t)); tx.append(li); });
  body.append(demo, tx); panel.append(el("h2", "", "How to play"), body, el("div", "hbtns", "")); panel.lastChild.append(ok);
  back.append(panel); document.body.append(back); play(); ok.focus();
}
$("helpBtn").onclick = openHelp;

$("gTitle").textContent = GAME.title;
$("gSub").textContent = [GAME.module, GAME.lesson, GAME.subtitle].filter(Boolean).join(" · ");
if (GAME.logo) { $("logo").src = GAME.logo; $("logo").style.display = "block"; }
document.title = GAME.title + ": Word Hunt";
start();
</script>
</body>
